<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="820" viewBox="0 0 1380 820">
  <defs>
    <style>
      .title { font-family: Arial; font-size: 28px; font-weight: 700; fill: #1f2937; }
      .label { font-family: Arial; font-size: 18px; font-weight: 600; fill: #111827; }
      .small { font-family: Arial; font-size: 14px; font-weight: 400; fill: #334155; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; rx: 16; ry: 16; }
      .a { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2.5; rx: 16; ry: 16; }
      .b { fill: #dcfce7; stroke: #15803d; stroke-width: 2.5; rx: 16; ry: 16; }
      .c { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; rx: 16; ry: 16; }
      .d { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.5; rx: 16; ry: 16; }
      .out { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#m); }
      .dash { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1340" height="780" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="48" y="62" class="title">Foreground-Mask-Aware Relative Highlight Supervision Flow</text>

  <rect x="60" y="120" width="170" height="80" class="box"/>
  <text x="100" y="155" class="label">Raw Image</text>
  <text x="138" y="180" class="label">I</text>

  <rect x="290" y="120" width="170" height="80" class="box"/>
  <text x="323" y="155" class="label">Luminance Map</text>
  <text x="368" y="180" class="label">L</text>

  <rect x="540" y="84" width="260" height="110" class="a"/>
  <text x="624" y="118" class="label">Branch A</text>
  <text x="585" y="144" class="small">explicit alpha / mask if available</text>
  <text x="586" y="167" class="small">otherwise fallback threshold = 0.96</text>
  <text x="642" y="190" class="label">Foreground M</text>

  <rect x="540" y="248" width="260" height="220" class="b"/>
  <text x="625" y="282" class="label">Branch B</text>
  <text x="579" y="312" class="label">Blur for Threshold Estimation</text>
  <rect x="575" y="330" width="190" height="58" fill="#ffffff" stroke="#15803d" stroke-width="2" rx="12" ry="12"/>
  <text x="625" y="365" class="label">B(L)</text>
  <rect x="575" y="404" width="190" height="58" fill="#ffffff" stroke="#15803d" stroke-width="2" rx="12" ry="12"/>
  <text x="612" y="439" class="label">Q_q in M</text>
  <text x="586" y="492" class="small">dynamic threshold tau inside foreground</text>

  <rect x="860" y="248" width="260" height="220" class="d"/>
  <text x="945" y="282" class="label">Branch C</text>
  <text x="904" y="312" class="label">Local Relative Highlight</text>
  <rect x="895" y="330" width="190" height="58" fill="#ffffff" stroke="#6d28d9" stroke-width="2" rx="12" ry="12"/>
  <text x="946" y="365" class="label">mu_fg</text>
  <rect x="895" y="404" width="190" height="58" fill="#ffffff" stroke="#6d28d9" stroke-width="2" rx="12" ry="12"/>
  <text x="936" y="439" class="label">S_rel = L - mu_fg</text>
  <text x="905" y="492" class="small">foreground-normalized local brightness contrast</text>

  <rect x="550" y="564" width="560" height="148" class="out"/>
  <text x="730" y="600" class="label">Soft Highlight Composition</text>
  <text x="598" y="632" class="small">combine M, tau, and relative / luminance cues in image domain</text>
  <text x="620" y="662" class="small">H(p) = ((max(L(p)-T(p), 0)) / max(1-T(p), eps))^gamma * M(p)</text>
  <text x="754" y="692" class="label">Output: Soft Highlight Score H</text>

  <path d="M230 160 L290 160" class="arrow"/>
  <path d="M460 160 L540 139" class="arrow"/>
  <path d="M460 160 L540 301" class="arrow"/>
  <path d="M460 160 L860 301" class="arrow"/>

  <path d="M670 194 L670 248" class="dash"/>
  <path d="M800 139 L860 301" class="dash"/>
  <path d="M800 139 L800 564" class="arrow"/>
  <path d="M670 468 L670 564" class="arrow"/>
  <path d="M990 468 L990 564" class="arrow"/>

  <rect x="80" y="620" width="350" height="110" fill="#f9fafb" stroke="#94a3b8" stroke-width="2" rx="14" ry="14"/>
  <text x="104" y="654" class="label">Equation Mapping</text>
  <text x="104" y="680" class="small">L: luminance converted from raw RGB image</text>
  <text x="104" y="703" class="small">M: explicit mask or white-bg fallback</text>
  <text x="104" y="726" class="small">tau: foreground quantile threshold on B(L)</text>

  <rect x="80" y="480" width="350" height="110" fill="#f9fafb" stroke="#94a3b8" stroke-width="2" rx="14" ry="14"/>
  <text x="104" y="514" class="label">Code Logic</text>
  <text x="104" y="540" class="small">compute_foreground_mask(...)</text>
  <text x="104" y="563" class="small">resolve_highlight_threshold_map(...)</text>
  <text x="104" y="586" class="small">compute_highlight_score_map(...)</text>
</svg>
