<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
  <defs>
    <style>
      .title { font-family: Arial; font-size: 28px; font-weight: 700; fill: #1f2937; }
      .label { font-family: Arial; font-size: 20px; font-weight: 600; fill: #111827; }
      .small { font-family: Arial; font-size: 15px; font-weight: 400; fill: #374151; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; rx: 18; ry: 18; }
      .object { fill: #d1d5db; stroke: #4b5563; stroke-width: 2.5; }
      .maskBad { fill: rgba(239,68,68,0.28); stroke: #b91c1c; stroke-width: 3; }
      .maskGood { fill: rgba(34,197,94,0.28); stroke: #15803d; stroke-width: 3; }
      .curve { stroke: #7c3aed; stroke-width: 4; fill: none; }
      .curve2 { stroke: #0284c7; stroke-width: 4; fill: none; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; ry: 12; }
    </style>
  </defs>

  <rect x="20" y="20" width="1280" height="680" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="48" y="62" class="title">Global Threshold vs. Local Relative Highlight Detection</text>

  <rect x="60" y="110" width="560" height="520" class="panel"/>
  <text x="210" y="148" class="label">Global Absolute Brightness</text>
  <text x="134" y="176" class="small">single global threshold tends to keep only the brightest fragments</text>

  <path class="object" d="M180 360 C190 250, 315 210, 420 240 C500 264, 540 332, 505 400 C475 459, 404 495, 315 486 C226 477, 168 432, 180 360 Z"/>
  <path class="maskBad" d="M350 265 C392 246, 431 257, 446 286 C454 301, 447 319, 427 329 C394 346, 340 337, 322 309 C312 293, 323 277, 350 265 Z"/>
  <path class="maskBad" d="M448 315 C468 309, 485 316, 491 331 C495 342, 488 353, 474 359 C456 366, 434 360, 428 346 C424 336, 431 321, 448 315 Z"/>
  <path class="curve" d="M140 548 C220 512, 306 502, 396 518 C470 532, 525 530, 570 508"/>
  <text x="138" y="576" class="small">global threshold misses the soft lobe boundary</text>

  <rect x="110" y="200" width="145" height="84" class="note"/>
  <text x="134" y="234" class="label">Metal / Plastic</text>
  <text x="126" y="258" class="small">wide soft highlight lobe</text>

  <rect x="700" y="110" width="560" height="520" class="panel"/>
  <text x="833" y="148" class="label">Local Relative Highlight</text>
  <text x="776" y="176" class="small">foreground-normalized local contrast keeps the broad highlight edge</text>

  <path class="object" d="M820 360 C830 250, 955 210, 1060 240 C1140 264, 1180 332, 1145 400 C1115 459, 1044 495, 955 486 C866 477, 808 432, 820 360 Z"/>
  <path class="maskGood" d="M902 258 C952 236, 1020 240, 1070 272 C1107 296, 1120 330, 1106 360 C1088 399, 1046 426, 987 437 C935 447, 888 439, 855 418 C822 397, 806 364, 812 333 C821 295, 851 274, 902 258 Z"/>
  <path class="curve2" d="M780 548 C866 500, 958 482, 1048 494 C1116 503, 1175 495, 1225 468"/>
  <text x="778" y="576" class="small">relative brightness captures a more continuous specular support</text>

  <rect x="766" y="200" width="168" height="84" class="note"/>
  <text x="798" y="234" class="label">Local Mean mu_fg</text>
  <text x="801" y="258" class="small">S_rel = L - mu_fg</text>

  <rect x="430" y="653" width="470" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="10" ry="10"/>
  <text x="452" y="676" class="small">Suggested usage in paper: show the left panel as failure case and the right panel as the motivation for local-relative highlight guidance.</text>
</svg>
