<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1736"/>
      <stop offset="45%" stop-color="#1a2d5c"/>
      <stop offset="100%" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6e6ff"/>
      <stop offset="100%" stop-color="#f6faff"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f1e3"/>
      <stop offset="100%" stop-color="#f6fffb"/>
    </linearGradient>
    <linearGradient id="guideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe2c7"/>
      <stop offset="100%" stop-color="#fff7ef"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eadbcb"/>
      <stop offset="100%" stop-color="#fff6ee"/>
    </linearGradient>
    <linearGradient id="unetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dae7ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#3b6db0"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f0b429"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#d77a1f"/>
    </marker>

    <style>
      .title { font: 700 26px "Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica","Arial",sans-serif; fill:#ffffff; }
      .subtitle { font: 500 14px "Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica","Arial",sans-serif; fill:#d6e4ff; }
      .section { font: 700 18px "Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica","Arial",sans-serif; fill:#0f1e3a; }
      .label { font: 600 14px "Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica","Arial",sans-serif; fill:#1a1a1a; }
      .small { font: 400 12px "Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica","Arial",sans-serif; fill:#2d2d2d; }
      .card { stroke:#485b7a; stroke-width:1.2; rx:12; }
      .input { fill:url(#inputGrad); }
      .core { fill:url(#coreGrad); }
      .guide { fill:url(#guideGrad); }
      .output { fill:url(#outputGrad); }
      .panel { fill:rgba(255,255,255,0.86); stroke:#b7c7e5; stroke-width:1.2; rx:14; }
      .cap { fill:#ffffff; opacity:0.35; }
      .line-blue { stroke:#3b6db0; stroke-width:2; stroke-opacity:0.75; fill:none; marker-end:url(#arrowBlue); }
      .line-gold { stroke:#f0b429; stroke-width:2.2; stroke-opacity:0.8; fill:none; marker-end:url(#arrowGold); }
      .line-orange { stroke:#d77a1f; stroke-width:2; stroke-opacity:0.75; fill:none; marker-end:url(#arrowOrange); }
      .glow-blue { stroke:#3b6db0; stroke-width:6; stroke-opacity:0.18; fill:none; }
      .glow-gold { stroke:#f0b429; stroke-width:6; stroke-opacity:0.2; fill:none; }
      .glow-orange { stroke:#d77a1f; stroke-width:6; stroke-opacity:0.18; fill:none; }
      .node-blue { fill:#ffffff; stroke:#3b6db0; stroke-width:2; filter:url(#glow); }
      .node-gold { fill:#ffffff; stroke:#f0b429; stroke-width:2; filter:url(#glow); }
      .node-orange { fill:#ffffff; stroke:#d77a1f; stroke-width:2; filter:url(#glow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="1000" fill="url(#bg)"/>

  <text class="title" x="50" y="55">GAFFER: Lighting Transfer for Neural Head Avatars</text>
  <text class="subtitle" x="50" y="78">Gaffer：神经头部替身的照明转移</text>

  <text class="section" x="70" y="120">输入 (Inputs)</text>
  <text class="section" x="520" y="120">Latent Conditioning &amp; Synthesis</text>
  <text class="section" x="1280" y="120">输出 (Output)</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect class="card input" x="70" y="150" width="360" height="86"/>
    <rect class="cap" x="82" y="158" width="336" height="16"/>
    <text class="label" x="90" y="180">条件图像 x_cond</text>
    <text class="small" x="90" y="200">待重光照的物体图像</text>
    <rect x="320" y="168" width="90" height="46" fill="#cfe0ff" stroke="#3b6db0" stroke-width="1"/>
  </g>

  <g filter="url(#shadow)">
    <rect class="card input" x="70" y="250" width="360" height="86"/>
    <rect class="cap" x="82" y="258" width="336" height="16"/>
    <text class="label" x="90" y="280">目标环境光 E_hdr / E_ldr</text>
    <text class="small" x="90" y="300">Environment Map / Light Probe</text>
    <circle cx="360" cy="293" r="23" fill="#dbe7ff" stroke="#3b6db0" stroke-width="1"/>
  </g>

  <g filter="url(#shadow)">
    <rect class="card input" x="70" y="350" width="360" height="86"/>
    <rect class="cap" x="82" y="358" width="336" height="16"/>
    <text class="label" x="90" y="380">加噪潜变量 z_t</text>
    <text class="small" x="90" y="400">扩散过程噪声 latent</text>
  </g>

  <!-- Conditioning modules -->
  <g filter="url(#shadow)">
    <rect class="card core" x="460" y="163" width="200" height="60"/>
    <rect class="cap" x="472" y="170" width="176" height="14"/>
    <text class="label" x="480" y="195">CLIP 编码器</text>
    <text class="small" x="480" y="212">跨注意力条件</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card core" x="460" y="263" width="200" height="60"/>
    <rect class="cap" x="472" y="270" width="176" height="14"/>
    <text class="label" x="480" y="295">VAE 编码器</text>
    <text class="small" x="480" y="312">图像/光照→latent</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card core" x="460" y="363" width="200" height="60"/>
    <rect class="cap" x="472" y="370" width="176" height="14"/>
    <text class="label" x="480" y="395">Latent 拼接</text>
  </g>

  <!-- U-Net -->
  <g filter="url(#shadow)">
    <rect x="680" y="150" width="540" height="260" rx="16" fill="url(#unetGrad)" stroke="#7ea1cc" stroke-width="1.4"/>
    <rect class="cap" x="694" y="160" width="512" height="16"/>
    <text class="label" x="720" y="185">Denoising U-Net</text>
    <text class="small" x="715" y="215">Attention Maps</text>
    <text class="small" x="1050" y="215">Saliency Maps</text>
    <rect x="730" y="235" width="22" height="64" fill="#cfe0ff" stroke="#6f92c7"/>
    <rect x="758" y="245" width="22" height="54" fill="#cfe0ff" stroke="#6f92c7"/>
    <rect x="786" y="253" width="22" height="46" fill="#cfe0ff" stroke="#6f92c7"/>
    <rect x="814" y="261" width="22" height="38" fill="#cfe0ff" stroke="#6f92c7"/>
    <rect x="1042" y="261" width="22" height="38" fill="#d6f2e3" stroke="#5fa67a"/>
    <rect x="1070" y="253" width="22" height="46" fill="#d6f2e3" stroke="#5fa67a"/>
    <rect x="1098" y="245" width="22" height="54" fill="#d6f2e3" stroke="#5fa67a"/>
    <rect x="1126" y="235" width="22" height="64" fill="#d6f2e3" stroke="#5fa67a"/>
  </g>

  <!-- pred_x0 -->
  <g filter="url(#shadow)">
    <rect class="card core" x="840" y="430" width="220" height="60"/>
    <rect class="cap" x="852" y="437" width="196" height="14"/>
    <text class="label" x="858" y="460">pred_x<tspan baseline-shift="sub" font-size="11">0</tspan> → x̂<tspan baseline-shift="sub" font-size="11">0</tspan></text>
    <text class="small" x="858" y="478">预测干净潜变量</text>
  </g>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect class="card output" x="1260" y="150" width="380" height="260"/>
    <rect class="cap" x="1272" y="160" width="356" height="16"/>
    <text class="label" x="1280" y="185">Generated Synthesis and Alpha Matte</text>
    <text class="small" x="1280" y="205">生成合成结果与 Alpha 蒙版</text>
    <rect x="1305" y="220" width="290" height="170" fill="#e8d8c7" stroke="#b38b6b"/>
  </g>

  <!-- Input to core lines -->
  <path class="glow-blue" d="M430 193 L460 193"/>
  <path class="line-blue" d="M430 193 L460 193"/>
  <path class="glow-blue" d="M430 293 L460 293"/>
  <path class="line-blue" d="M430 293 L460 293"/>
  <path class="glow-blue" d="M430 393 L460 393"/>
  <path class="line-blue" d="M430 393 L460 393"/>
  <circle class="node-blue" cx="460" cy="193" r="4"/>
  <circle class="node-blue" cx="460" cy="293" r="4"/>
  <circle class="node-blue" cx="460" cy="393" r="4"/>

  <!-- Core to U-Net lines -->
  <path class="glow-gold" d="M660 193 L680 193"/>
  <path class="line-gold" d="M660 193 L680 193"/>
  <path class="glow-gold" d="M660 293 L680 293"/>
  <path class="line-gold" d="M660 293 L680 293"/>
  <path class="glow-gold" d="M660 393 L680 393"/>
  <path class="line-gold" d="M660 393 L680 393"/>
  <circle class="node-gold" cx="680" cy="193" r="4"/>
  <circle class="node-gold" cx="680" cy="293" r="4"/>
  <circle class="node-gold" cx="680" cy="393" r="4"/>

  <!-- U-Net to pred_x0 and output -->
  <path class="glow-gold" d="M950 410 L950 430"/>
  <path class="line-gold" d="M950 410 L950 430"/>
  <circle class="node-gold" cx="950" cy="430" r="4"/>
  <path class="glow-gold" d="M1220 280 L1260 280"/>
  <path class="line-gold" d="M1220 280 L1260 280"/>
  <circle class="node-gold" cx="1260" cy="280" r="4"/>

  <!-- Physical Guidance Panel -->
  <rect class="panel" x="60" y="520" width="1580" height="420" filter="url(#shadow)"/>
  <text class="section" x="90" y="555">Physical Guidance &amp; Supervision</text>

  <!-- Guidance modules -->
  <g filter="url(#shadow)">
    <rect class="card guide" x="100" y="600" width="210" height="90"/>
    <rect class="cap" x="112" y="608" width="186" height="14"/>
    <text class="label" x="120" y="635">α<tspan baseline-shift="sub" font-size="11">pred</tspan></text>
    <text class="small" x="120" y="655">前景 Alpha 预测</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card guide" x="330" y="600" width="210" height="90"/>
    <rect class="cap" x="342" y="608" width="186" height="14"/>
    <text class="label" x="350" y="635">θ<tspan baseline-shift="sub" font-size="11">ref</tspan></text>
    <text class="small" x="350" y="655">参考光照参数</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card guide" x="560" y="600" width="210" height="90"/>
    <rect class="cap" x="572" y="608" width="186" height="14"/>
    <text class="label" x="580" y="635">W<tspan baseline-shift="sub" font-size="11">proj</tspan></text>
    <text class="small" x="580" y="655">投影权重</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card guide" x="790" y="600" width="210" height="90"/>
    <rect class="cap" x="802" y="608" width="186" height="14"/>
    <text class="label" x="810" y="635">pred_x<tspan baseline-shift="sub" font-size="11">0</tspan> → x̂<tspan baseline-shift="sub" font-size="11">0</tspan></text>
    <text class="small" x="810" y="655">像素空间重建</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card guide" x="1020" y="600" width="210" height="90"/>
    <rect class="cap" x="1032" y="608" width="186" height="14"/>
    <text class="label" x="1040" y="635">T<tspan baseline-shift="sub" font-size="11">head</tspan></text>
    <text class="small" x="1040" y="655">头部姿态</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card guide" x="1250" y="600" width="210" height="90"/>
    <rect class="cap" x="1262" y="608" width="186" height="14"/>
    <text class="label" x="1270" y="635">S<tspan baseline-shift="sub" font-size="11">head</tspan></text>
    <text class="small" x="1270" y="655">头部形状/语义</text>
  </g>

  <!-- Guidance arrows -->
  <path class="glow-orange" d="M310 645 L330 645"/>
  <path class="line-orange" d="M310 645 L330 645"/>
  <path class="glow-orange" d="M540 645 L560 645"/>
  <path class="line-orange" d="M540 645 L560 645"/>
  <path class="glow-orange" d="M770 645 L790 645"/>
  <path class="line-orange" d="M770 645 L790 645"/>
  <path class="glow-orange" d="M1000 645 L1020 645"/>
  <path class="line-orange" d="M1000 645 L1020 645"/>
  <path class="glow-orange" d="M1230 645 L1250 645"/>
  <path class="line-orange" d="M1230 645 L1250 645"/>
  <circle class="node-orange" cx="330" cy="645" r="4"/>
  <circle class="node-orange" cx="560" cy="645" r="4"/>
  <circle class="node-orange" cx="790" cy="645" r="4"/>
  <circle class="node-orange" cx="1020" cy="645" r="4"/>
  <circle class="node-orange" cx="1250" cy="645" r="4"/>

  <!-- Links from core to guidance -->
  <path class="glow-orange" d="M950 490 L895 600"/>
  <path class="line-orange" d="M950 490 L895 600"/>
  <circle class="node-orange" cx="895" cy="600" r="4"/>

  <!-- Loss -->
  <g filter="url(#shadow)">
    <rect class="card guide" x="100" y="735" width="1360" height="70"/>
    <rect class="cap" x="112" y="742" width="1336" height="14"/>
    <text class="label" x="130" y="772">L_total = L_recon + λ · L_phys</text>
    <text class="small" x="130" y="792">λ 为物理引导权重</text>
  </g>
</svg>
