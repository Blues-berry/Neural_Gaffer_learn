<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="860" viewBox="0 0 1460 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fc"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="latentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="probeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="teacherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="hybridGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="replaceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>

    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>

    <style>
      .title { font-family:"Arial",sans-serif; font-size:29px; font-weight:700; fill:#0f172a; }
      .subtitle { font-family:"Arial",sans-serif; font-size:15px; font-weight:500; fill:#475569; }
      .section { font-family:"Arial",sans-serif; font-size:20px; font-weight:700; fill:#0f172a; }
      .label { font-family:"Arial",sans-serif; font-size:16px; font-weight:700; fill:#111827; }
      .small { font-family:"Arial",sans-serif; font-size:13px; font-weight:500; fill:#334155; }
      .tiny { font-family:"Arial",sans-serif; font-size:12px; font-weight:500; fill:#475569; }
      .box { stroke-width:2.2; rx:18; ry:18; filter:url(#shadow); }
      .latent { fill:url(#latentGrad); stroke:#2563eb; }
      .probe { fill:url(#probeGrad); stroke:#16a34a; }
      .teacher { fill:url(#teacherGrad); stroke:#ea580c; }
      .hybrid { fill:url(#hybridGrad); stroke:#7c3aed; }
      .replace { fill:url(#replaceGrad); stroke:#dc2626; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:22; ry:22; }
      .cap { fill:#ffffff; opacity:0.42; }
      .line-blue { stroke:#2563eb; stroke-width:3.2; fill:none; marker-end:url(#arrowBlue); }
      .line-green { stroke:#16a34a; stroke-width:3.2; fill:none; marker-end:url(#arrowGreen); }
      .line-orange { stroke:#ea580c; stroke-width:3.2; fill:none; marker-end:url(#arrowOrange); }
      .line-purple { stroke:#7c3aed; stroke-width:3.2; fill:none; marker-end:url(#arrowPurple); }
      .line-red { stroke:#dc2626; stroke-width:3.2; fill:none; marker-end:url(#arrowRed); }
      .dash-purple { stroke:#7c3aed; stroke-width:2.8; fill:none; stroke-dasharray:10 8; marker-end:url(#arrowPurple); }
      .dash-orange { stroke:#ea580c; stroke-width:2.8; fill:none; stroke-dasharray:10 8; marker-end:url(#arrowOrange); }
      .badge { fill:#0f172a; }
      .badgeText { font-family:"Arial",sans-serif; font-size:13px; font-weight:700; fill:#ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1460" height="860" fill="url(#bg)"/>
  <rect x="26" y="26" width="1408" height="808" class="panel"/>

  <text x="58" y="76" class="title">Lighting Probe / Latent Highlight Probe Principle</text>
  <text x="58" y="104" class="subtitle">How the latent highlight probe reads pred_x0 latents and connects to teacher, replacement, and hybrid training.</text>

  <text x="76" y="156" class="section">1. Shared Inputs</text>
  <text x="522" y="156" class="section">2. Probe Prediction</text>
  <text x="956" y="156" class="section">3. Training Modes</text>

  <rect x="76" y="192" width="320" height="118" class="box latent"/>
  <rect x="90" y="202" width="292" height="18" class="cap"/>
  <text x="98" y="238" class="label">pred_x<tspan baseline-shift="sub" font-size="12">0</tspan> latent</text>
  <text x="98" y="266" class="small">clean latent reconstructed from U-Net output and the scheduler</text>
  <text x="98" y="289" class="small">code path: predict_x0_from_model_pred(...)</text>

  <rect x="76" y="354" width="320" height="118" class="box teacher"/>
  <rect x="90" y="364" width="292" height="18" class="cap"/>
  <text x="98" y="400" class="label">Teacher Highlight Target</text>
  <text x="98" y="428" class="small">soft highlight score and mask derived from GT images</text>
  <text x="98" y="451" class="small">code path: compute_training_highlight_maps(...)</text>

  <rect x="76" y="516" width="320" height="118" class="box latent"/>
  <rect x="90" y="526" width="292" height="18" class="cap"/>
  <text x="98" y="562" class="label">Optional Detach</text>
  <text x="98" y="590" class="small">optionally stop gradients before sending pred_x<tspan baseline-shift="sub" font-size="11">0</tspan> to the probe</text>
  <text x="98" y="613" class="small">flag: latent_highlight_probe_detach_input</text>

  <rect x="472" y="260" width="360" height="160" class="box probe"/>
  <rect x="486" y="270" width="332" height="18" class="cap"/>
  <text x="504" y="308" class="label">LatentHighlightProbe</text>
  <text x="504" y="336" class="small">1x1 Conv → SiLU → 1x1 Conv</text>
  <text x="504" y="359" class="small">输入：4-channel pred_x<tspan baseline-shift="sub" font-size="11">0</tspan> latent</text>
  <text x="504" y="382" class="small">输出：1-channel probe logits / probability map</text>
  <text x="504" y="405" class="small">code path: class LatentHighlightProbe</text>

  <rect x="472" y="486" width="360" height="118" class="box probe"/>
  <rect x="486" y="496" width="332" height="18" class="cap"/>
  <text x="504" y="532" class="label">Probe Supervision</text>
  <text x="504" y="560" class="small">BCEWithLogits(probe_logits, teacher highlight score)</text>
  <text x="504" y="583" class="small">metrics such as separation and brier are measured inside the foreground mask</text>

  <rect x="928" y="206" width="446" height="170" class="box teacher"/>
  <rect x="942" y="216" width="418" height="18" class="cap"/>
  <text x="960" y="252" class="label">A. Image-Space Teacher Branch</text>
  <text x="960" y="280" class="small">pred_x<tspan baseline-shift="sub" font-size="11">0</tspan> latent → VAE decode → image-space MSE</text>
  <text x="960" y="303" class="small">the same highlight weight and mask reinforce specular regions in RGB space</text>
  <text x="960" y="326" class="small">this branch stays on in the main method for stronger supervision</text>
  <circle cx="1324" cy="290" r="34" fill="#fff7ed" stroke="#ea580c" stroke-width="2.6"/>
  <text x="1303" y="296" class="label">Teacher</text>

  <rect x="928" y="402" width="446" height="170" class="box replace"/>
  <rect x="942" y="412" width="418" height="18" class="cap"/>
  <text x="960" y="448" class="label">B. Pure Replacement</text>
  <text x="960" y="476" class="small">turn off image-space decode backprop and keep only latent probe BCE</text>
  <text x="960" y="499" class="small">cheaper to train, but used as an ablation rather than the main method</text>
  <rect x="1228" y="454" width="118" height="48" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="14" ry="14"/>
  <text x="1246" y="484" class="label">replacement</text>

  <rect x="928" y="598" width="446" height="170" class="box hybrid"/>
  <rect x="942" y="608" width="418" height="18" class="cap"/>
  <text x="960" y="644" class="label">C. Hybrid Distillation</text>
  <text x="960" y="672" class="small">keep the teacher early, then gradually reduce image-space weight later</text>
  <text x="960" y="695" class="small">increase probe loss weight to trade some quality for efficiency</text>
  <rect x="1178" y="650" width="164" height="64" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="16" ry="16"/>
  <text x="1210" y="678" class="label">alpha(t) ↓</text>
  <text x="1212" y="701" class="label">beta(t) ↑</text>

  <path d="M396 251 L472 320" class="line-blue"/>
  <path d="M396 575 L472 340" class="dash-orange"/>
  <path d="M396 413 L472 545" class="line-orange"/>
  <path d="M832 340 L928 290" class="line-green"/>
  <path d="M832 340 L928 487" class="line-red"/>
  <path d="M832 545 L928 487" class="line-red"/>
  <path d="M832 340 L928 682" class="dash-purple"/>
  <path d="M832 545 L928 682" class="line-purple"/>
  <path d="M1308 324 L1308 598" class="dash-purple"/>

  <rect x="88" y="694" width="756" height="104" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="18" ry="18"/>
  <text x="112" y="728" class="label">Code-to-Figure Mapping</text>
  <text x="112" y="756" class="tiny">pred_x0_latents come from predict_x0_from_model_pred(...), and LatentHighlightProbe predicts probe_logits.</text>
  <text x="112" y="778" class="tiny">Targets come from compute_training_highlight_maps(...); hybrid scheduling uses the final image-space and probe scales.</text>

  <rect x="1138" y="118" width="220" height="34" class="badge"/>
  <text x="1170" y="140" class="badgeText">Efficiency Variant, Not Main Contribution</text>
</svg>
